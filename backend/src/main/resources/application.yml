spring:
  application:
    name: VemResolver-servicos

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dbcore001_d}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

jwt:
  secret: ${JWT_SECRET:MinhaChaveSuperSecretaExtremamenteLongaParaSegurancaDoMarketplace2026!@#$}
  expiration: ${JWT_EXPIRATION:86400000}
