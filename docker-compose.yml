version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: marketplace-postgres
    environment:
      POSTGRES_DB: marketplace_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - marketplace-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marketplace-backend
    depends_on:
      - postgres
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/marketplace_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: bWFya2V0cGxhY2UtZGV2LXNlY3JldC1rZXktbWluaW11bS0yNTZiaXRzLWxlbmd0aC1vaw==
      JWT_EXPIRATION: 86400000
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USERNAME: dev@localhost
      MAIL_PASSWORD: dev
      FRONTEND_URL: http://localhost:4200
      UPLOAD_DIR: /uploads
    volumes:
      - uploads_data:/uploads
    ports:
      - "8080:8080"
    networks:
      - marketplace-network
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    container_name: marketplace-frontend
    working_dir: /app
    volumes:
      - ./frontend/marketplace-frontend:/app
    command: sh -c "npm install && npm start"
    ports:
      - "4200:4200"
    networks:
      - marketplace-network
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:

networks:
  marketplace-network:
    driver: bridge
